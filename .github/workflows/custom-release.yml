name: Custom Release

# Uploads the CLI guide PDF and README.md to the existing GitHub Release.
on:
  push:
    branches: [custom-patch/alt-hold-throttle-range]
    paths: [.github/workflows/custom-release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v2025.12.5-custom-v10
    steps:
      - uses: actions/checkout@v4
      - name: Upload docs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la custom-patch
          gh release upload "$TAG" custom-patch/*.pdf custom-patch/README.md \
            --repo "$GITHUB_REPOSITORY" --clobber
